<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تکمیل سفارش | Layer‑X</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <div class="header-left">
        <img src="logo.png" class="logo">
        <div>
            <h1 class="brand-title">Layer‑X</h1>
            <p class="brand-sub">طراحی و اجرای مدل‌های سه‌بعدی</p>
        </div>
    </div>

    <nav class="nav">
        <a href="index.html">صفحه اصلی</a>
        <a href="contact.html">تماس با ما</a>
        <a href="policy.html">قوانین</a>

        <a href="cart.html" class="cart-link">
            سبد خرید
            <span id="cart-count" class="cart-badge">0</span>
        </a>
    </nav>

</header>

<section class="featured main">
    <h2>تکمیل اطلاعات سفارش</h2>

    <div class="checkout-box">

        <form class="checkout-form">

            <label>نام و نام خانوادگی</label>
            <input type="text" id="name" required>

            <label>شماره موبایل</label>
            <input type="text" id="phone" placeholder="مثال: 09121234567" required>

            <label>ایمیل</label>
            <input type="email" id="email" placeholder="example@gmail.com" required>

            <button type="button" class="btn" id="sendCodeBtn" onclick="sendEmailCode()">
                ارسال کد تأیید
            </button>

            <label>کد تأیید ایمیل</label>
            <input type="text" id="emailCode" placeholder="کد ارسال شده را وارد کنید" required>

            <label>آدرس کامل</label>
            <textarea id="address" required></textarea>

            <label>روش ارسال</label>
            <select id="shipping">
                <option value="پست پیشتاز">پست پیشتاز</option>
                <option value="پست سفارشی">پست سفارشی</option>
            </select>

            <label>یادداشت سفارش (اختیاری)</label>
            <textarea id="note"></textarea>

            <button type="button" class="btn" onclick="submitOrder()">ثبت سفارش</button>

        </form>

    </div>
</section>

<footer class="footer">
    © 2026 Layer‑X
</footer>

<script src="script.js"></script>

</body>
</html>
