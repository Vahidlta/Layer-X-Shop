<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت اطلاعات | Layer‑X</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <img src="logo.png" alt="Layer-X Logo" class="logo">
        <h2 class="subtitle">طراحی و اجرای مدل‌های سه‌بعدی</h2>

        <nav class="nav">
            <a href="index.html">صفحه اصلی</a>
            <a href="products.html">محصولات</a>
            <a href="cart.html">سبد خرید</a>
        </nav>
    </header>

    <!-- Checkout Form -->
    <section class="featured">
        <h2>ثبت اطلاعات مشتری</h2>

        <form class="checkout-form">

            <label>نام و نام خانوادگی</label>
            <input type="text" placeholder="مثال: وحید احمدی" required>

            <label>شماره موبایل</label>
            <input type="tel" placeholder="مثال: 0912xxxxxxx" required>

            <label>آدرس کامل</label>
            <textarea placeholder="آدرس دقیق برای ارسال سفارش..." required></textarea>

            <label>روش ارسال</label>
            <select required>
                <option value="post">پست پیشتاز</option>
                <option value="tipax">تیپاکس</option>
                <option value="motor">پیک (فقط تهران)</option>
            </select>

            <label>یادداشت (اختیاری)</label>
            <textarea placeholder="اگر توضیح خاصی دارید اینجا بنویسید..."></textarea>

            <button class="btn" type="submit">ثبت سفارش</button>
        </form>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <img src="logo.png" class="footer-logo">
        <p>© 2026 Layer‑X — طراحی و اجرای مدل‌های سه‌بعدی</p>
    </footer>

</body>
</html>
