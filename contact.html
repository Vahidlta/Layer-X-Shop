<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تماس با ما | Layer‑X</title>

    <style>
        @font-face {
            font-family: 'Vazir';
            src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font/dist/Vazir.woff2') format('woff2');
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Vazir', sans-serif;
            background: #ffffff;
            color: #111111;
        }

        /* HEADER */
        .header {
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:14px 28px;
            border-bottom:1px solid #ddd;
            background:#fff;
            position:sticky;
            top:0;
            z-index:10;
        }

        .header-left {
            display:flex;
            align-items:center;
            gap:10px;
        }

        .logo { height:42px; transition:0.2s; }

        .nav {
            display:flex;
            gap:18px;
        }
        .nav a {
            text-decoration:none;
            color:#111;
            font-size:14px;
        }

        /* MAIN */
        .featured {
            max-width:900px;
            margin:40px auto;
            padding:0 20px;
        }

        .contact-box {
            background:#fafafa;
            border:1px solid #ddd;
            border-radius:14px;
            padding:25px;
            margin-top:20px;
        }

        .contact-form {
            margin-top:20px;
            display:flex;
            flex-direction:column;
            gap:12px;
        }

        .contact-form input,
        .contact-form textarea {
            width:100%;
            padding:10px;
            border-radius:8px;
            border:1px solid #ccc;
            font-family:'Vazir';
            font-size:14px;
        }

        .contact-form textarea {
            height:120px;
            resize:none;
        }

        .btn {
            padding:10px 16px;
            border-radius:10px;
            background:#111111;
            color:#fff;
            border:none;
            cursor:pointer;
            font-family:'Vazir';
            font-size:14px;
            margin-top:10px;
        }

        /* FOOTER */
        .footer {
            text-align:center;
            padding:20px;
            color:#666;
            border-top:1px solid #ddd;
            margin-top:40px;
        }

        /* MOBILE */
        @media (max-width:768px) {
            .logo { height:32px; }
            .nav { gap:10px; }
            .nav a { font-size:12px; }
            .header-left { gap:6px; }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="header">

        <div class="header-left">
            <img src="logo.png" class="logo">
            <div>
                <h1 style="margin:0; font-size:18px; font-weight:700;">Layer‑X</h1>
                <p style="margin:0; font-size:12px; color:#6b7280;">طراحی و اجرای مدل‌های سه‌بعدی</p>
            </div>
        </div>

        <nav class="nav">
            <a href="index.html">صفحه اصلی</a>
            <a href="policy.html">قوانین</a>
            <a href="cart.html">سبد خرید</a>
        </nav>

    </header>

    <!-- Contact Section -->
    <section class="featured">
        <h2>تماس با ما</h2>

        <div class="contact-box">

            <p>برای ارتباط با ما می‌توانید از روش‌های زیر استفاده کنید:</p>

            <h3>ایمیل</h3>
            <p>support@layer-x.ir</p>

            <h3>تلگرام</h3>
            <p>@LayerX_Support</p>

            <h3>فرم ارسال پیام</h3>

            <form class="contact-form">
                <label>نام شما</label>
                <input type="text" placeholder="نام و نام خانوادگی" required>

                <label>ایمیل</label>
                <input type="email" placeholder="example@mail.com" required>

                <label>پیام شما</label>
                <textarea placeholder="متن پیام..." required></textarea>

                <button class="btn" type="submit">ارسال پیام</button>
            </form>

        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        © 2026 Layer‑X
    </footer>

</body>
</html>
