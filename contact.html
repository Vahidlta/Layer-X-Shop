<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تماس با ما | Layer‑X</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <img src="logo.png" alt="Layer-X Logo" class="logo">
        <h2 class="subtitle">طراحی و اجرای مدل‌های سه‌بعدی</h2>

        <nav class="nav">
            <a href="index.html">صفحه اصلی</a>
            <a href="products.html">محصولات</a>
            <a href="policy.html">قوانین</a>
        </nav>
    </header>

    <!-- Contact Section -->
    <section class="featured">
        <h2>تماس با ما</h2>

        <div class="contact-box">

            <p>برای ارتباط با ما می‌توانید از روش‌های زیر استفاده کنید:</p>

            <h3>ایمیل</h3>
            <p>support@layer-x.ir</p>

            <h3>تلگرام</h3>
            <p>@LayerX_Support</p>

            <h3>فرم ارسال پیام</h3>

            <form class="contact-form">
                <label>نام شما</label>
                <input type="text" placeholder="نام و نام خانوادگی" required>

                <label>ایمیل</label>
                <input type="email" placeholder="example@mail.com" required>

                <label>پیام شما</label>
                <textarea placeholder="متن پیام..." required></textarea>

                <button class="btn" type="submit">ارسال پیام</button>
            </form>

        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <img src="logo.png" class="footer-logo">
        <p>© 2026 Layer‑X — طراحی و اجرای مدل‌های سه‌بعدی</p>
    </footer>

</body>
</html>
