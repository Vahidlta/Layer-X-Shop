<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>فروشگاه Layer‑X</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- PapaParse برای خواندن CSV بدون خطا -->
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <style>
        @font-face {
            font-family: 'Vazir';
            src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font/dist/Vazir.woff2') format('woff2');
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Vazir', sans-serif;
            background: #ffffff;
            color: #111111;
        }

        /* HEADER */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 28px;
            border-bottom: 1px solid rgba(17,17,17,0.12);
            background: #ffffff;
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo { height: 42px; }

        .brand-title { font-size: 18px; margin: 0; font-weight: 700; }
        .brand-sub { font-size: 12px; color: #6b7280; margin: 0; }

        .nav { display: flex; gap: 18px; }
        .nav a { text-decoration: none; color: #111111; font-size: 14px; padding: 6px 10px; border-radius: 8px; }

        /* MAIN */
        .main {
            max-width: 1100px;
            margin: 32px auto 140px;
            padding: 0 16px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 28px;
        }

        .product-card {
            background: #ffffff;
            border: 1px solid rgba(17,17,17,0.15);
            border-radius: 14px;
            padding: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
            transition: 0.25s;
            position: relative;
        }

        .product-image {
            width: 100%;
            height: 240px;
            object-fit: contain;
            margin-bottom: 12px;
        }

        /* STATUS */
        .status {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 13px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 8px;
        }

        .in-stock { background: #d1fae5; color: #065f46; }
        .out-stock { background: #fee2e2; color: #991b1b; }

        /* COLORS */
        .color-options {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }

        .color-circle {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .color-circle.white { border: 1px solid #ccc; }
        .color-circle.selected { border-color: #111111; transform: scale(1.15); }

        .product-title { font-size: 16px; font-weight: 600; margin: 4px 0; }
        .product-info { font-size: 13px; color: #4b5563; line-height: 1.8; margin-bottom: 12px; }
        .product-price { font-size: 15px; font-weight: 700; margin-bottom: 14px; }

        .btn {
            padding: 10px 16px;
            border-radius: 10px;
            background: #111111;
            color: #fff;
            border: none;
            cursor: pointer;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #6b7280;
            border-top: 1px solid rgba(17,17,17,0.15);
        }
    </style>
</head>

<body>

<header class="header">
    <nav class="nav">
        <a href="contact.html">تماس با ما</a>
        <a href="policy.html">قوانین</a>
        <a href="cart.html">سبد خرید</a>
    </nav>

    <div class="header-left">
        <img src="logo.png" class="logo">
        <div>
            <h1 class="brand-title">Layer‑X</h1>
            <p class="brand-sub">طراحی و اجرای مدل‌های سه‌بعدی</p>
        </div>
    </div>
</header>

<main class="main">
    <div class="products-grid" id="products"></div>
</main>

<footer class="footer">
    © 2026 Layer‑X — طراحی و اجرای مدل‌های سه‌بعدی
</footer>

<script>

const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSrjXH-PDT3MeRA9UGsaJBQwoRfErVtwjifuF7QtFvDcLfwxIki-A7F2FjAD_V5OEDrJSMUrj03aUBT/pub?gid=0&single=true&output=csv";

let selectedColor = null;

function selectColor(el, color) {
    selectedColor = color;
    const all = el.parentElement.querySelectorAll('.color-circle');
    all.forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
}

function addToCart(product) {
    if (!selectedColor) return alert("لطفاً رنگ را انتخاب کنید");
    product.color = selectedColor;
    let cart = JSON.parse(localStorage.getItem("cart") || "[]");
    cart.push(product);
    localStorage.setItem("cart", JSON.stringify(cart));
    alert("به سبد خرید اضافه شد");
}

function getColorCode(name) {
    if (name === "سفید") return "#ffffff";
    if (name === "طوسی") return "#bfbfbf";
    if (name === "مشکی") return "#000000";
    if (name === "قرمز") return "#ff0000";
    if (name === "آبی") return "#007bff";
    if (name === "سبز") return "#00cc66";
    if (name === "زرد") return "#ffcc00";
    if (name === "نارنجی") return "#ff8800";
    if (name === "طلایی") return "#d4af37";
    if (name === "نقره‌ای") return "#c0c0c0";
    return "#000";
}


Papa.parse(CSV_URL, {
    download: true,
    header: true,
    complete: function(result) {
        renderProducts(result.data);
    }
});

function renderProducts(products) {

    // مرتب‌سازی از جدید به قدیم
    products.sort((a, b) => Number(b.id) - Number(a.id));

    const container = document.getElementById("products");
    container.innerHTML = "";

    products.forEach(p => {
        if (!p.name) return;

        container.innerHTML += `
            <div class="product-card">

                <div class="status ${p.stock === 'موجود' ? 'in-stock' : 'out-stock'}">
                    ${p.stock}
                </div>

                <img src="${p.image}" class="product-image">

                <div class="color-options">
                    ${p.colors.split(",").map(c => `
                        <div class="color-circle ${c === 'سفید' ? 'white' : ''}"
                             style="background:${getColorCode(c)}"
                             onclick="selectColor(this, '${c}')"></div>
                    `).join("")}
                </div>

                <h3 class="product-title">${p.name}</h3>

                <div class="product-info">
                    نوع مواد : ${p.material}<br>
                    ابعاد محصول : ${p.size}<br>
                    توضیحات : ${p.desc}
                </div>

                <p class="product-price">${p.price} تومان</p>

                <button class="btn" onclick='addToCart(${JSON.stringify(p)})'>
                    افزودن به سبد خرید
                </button>

            </div>
        `;
    });
}

</script>

</body>
</html>
