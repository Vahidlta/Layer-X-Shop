<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>فروشگاه Layer‑X</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <style>
        @font-face {
            font-family: 'Vazir';
            src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font/dist/Vazir.woff2') format('woff2');
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            font-family: 'Vazir', sans-serif;
            background: #fff; color: #111;
        }

        .header {
            display:flex; justify-content:space-between; align-items:center;
            padding:14px 28px; border-bottom:1px solid #ddd;
            position:sticky; top:0; background:#fff; z-index:10;
        }
        .logo { height:42px; transition:0.2s; }

        .main { max-width:1100px; margin:32px auto 140px; padding:0 16px; }

        .products-grid {
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:28px;
        }

        .product-card {
            border:1px solid #ddd; border-radius:14px;
            padding:18px; box-shadow:0 4px 10px rgba(0,0,0,0.04);
            position:relative;
        }

        .product-image {
            width:100%; height:240px; object-fit:contain; margin-bottom:12px;
        }

        .status {
            position:absolute; top:12px; right:12px;
            padding:4px 10px; border-radius:8px; font-size:13px; font-weight:600;
        }
        .in-stock { background:#d1fae5; color:#065f46; }
        .out-stock { background:#fee2e2; color:#991b1b; }

        .color-options { display:flex; gap:8px; margin-bottom:14px; }
        .color-circle {
            width:20px; height:20px; border-radius:50%;
            cursor:pointer; transition:0.2s;
        }

        .btn {
            padding:10px 16px; border-radius:10px;
            background:#111; color:#fff; border:none; cursor:pointer;
        }

        .footer {
            text-align:center; padding:20px; color:#666;
            border-top:1px solid #ddd;
        }
    </style>
</head>

<body>

<header class="header">
    <div></div>
    <img src="logo.png" class="logo">
    <div></div>
</header>

<main class="main">
    <div class="products-grid" id="products"></div>
</main>

<footer class="footer">
    © 2026 Layer‑X
</footer>

<script>

const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSrjXH-PDT3MeRA9UGsaJBQwoRfErVtwjifuF7QtFvDcLfwxIki-A7F2FjAD_V5OEDrJSMUrj03aUBT/pub?gid=0&single=true&output=csv";

let selectedColor = null;

/* --- انتخاب رنگ: تبدیل دایره به مربع --- */
function selectColor(el, color) {
    selectedColor = color;

    const all = el.parentElement.querySelectorAll('.color-circle');
    all.forEach(c => {
        c.style.borderRadius = "50%";
        c.style.transform = "scale(1)";
    });

    el.style.borderRadius = "6px";
    el.style.transform = "scale(1.25)";
}

/* --- تغییر تعداد با + و – --- */
function changeQty(btn, amount) {
    const box = btn.parentElement;
    const valueEl = box.querySelector(".qty-value");
    let qty = Number(valueEl.innerText);

    qty += amount;
    if (qty < 1) qty = 1;

    valueEl.innerText = qty;
}

/* --- افزودن به سبد خرید --- */
function addToCart(product, qty) {
    if (!selectedColor) return alert("لطفاً رنگ را انتخاب کنید");

    product.color = selectedColor;
    product.qty = Number(qty);

    let cart = JSON.parse(localStorage.getItem("cart") || "[]");
    cart.push(product);
    localStorage.setItem("cart", JSON.stringify(cart));

    alert("به سبد خرید اضافه شد");
}

/* --- رنگ‌ها --- */
function getColorCode(name) {
    if (name === "سفید") return "#ffffff";
    if (name === "طوسی") return "#bfbfbf";
    if (name === "مشکی") return "#000000";
    if (name === "قرمز") return "#ff0000";
    if (name === "آبی") return "#007bff";
    if (name === "سبز") return "#00cc66";
    if (name === "زرد") return "#ffcc00";
    if (name === "نارنجی") return "#ff8800";
    if (name === "طلایی") return "#d4af37";
    if (name === "نقره‌ای") return "#c0c0c0";
    return "#000";
}

/* --- ریسپانسیو موبایل --- */
function applyMobileLayout() {
    const grid = document.querySelector(".products-grid");
    const logo = document.querySelector(".logo");

    if (window.innerWidth <= 768) {
        grid.style.gridTemplateColumns = "1fr";
        logo.style.height = "32px";
    } else {
        grid.style.gridTemplateColumns = "repeat(3, 1fr)";
        logo.style.height = "42px";
    }
}

window.addEventListener("load", applyMobileLayout);
window.addEventListener("resize", applyMobileLayout);

/* --- لود CSV --- */
Papa.parse(CSV_URL, {
    download: true,
    header: true,
    complete: function(result) {
        renderProducts(result.data);
    }
});

/* --- ساخت کارت‌ها --- */
function renderProducts(products) {

    products.sort((a, b) => Number(b.id) - Number(a.id));

    const container = document.getElementById("products");
    container.innerHTML = "";

    products.forEach(p => {
        if (!p.name) return;

        container.innerHTML += `
            <div class="product-card">

                <div class="status ${p.stock === 'موجود' ? 'in-stock' : 'out-stock'}">
                    ${p.stock}
                </div>

                <img src="${p.image}" class="product-image">

                <div class="color-options">
                    ${p.colors.split(",").map(c => `
                        <div class="color-circle"
                             style="background:${getColorCode(c)}"
                             onclick="selectColor(this, '${c}')"></div>
                    `).join("")}
                </div>

                <h3 class="product-title">${p.name}</h3>

                <div class="product-info">
                    نوع مواد : ${p.material}<br>
                    ابعاد محصول : ${p.size}<br>
                    توضیحات : ${p.desc}
                </div>

                <p class="product-price">${p.price} تومان</p>

<div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">

    <button class="btn"
        style="font-family: Vazir; font-size:14px;"
        onclick='addToCart(${JSON.stringify(p)}, this.parentElement.querySelector(".qty-value").innerText)'>
        افزودن به سبد خرید
    </button>

    <div class="qty-box" style="display:flex; align-items:center; gap:8px;">

        <button onclick="changeQty(this, -1)"
            style="width:24px; height:24px; border-radius:6px; border:none; background:#eee; font-size:16px; cursor:pointer;">
            –
        </button>

        <span class="qty-value" style="min-width:26px; text-align:center; font-size:16px; font-weight:600;">
            1
        </span>

        <button onclick="changeQty(this, 1)"
            style="width:24px; height:24px; border-radius:6px; border:none; background:#eee; font-size:16px; cursor:pointer;">
            +
        </button>

    </div>

</div>

        `;
    });

    applyMobileLayout();
}

</script>

</body>
</html>
